:root {
  --ink: #111; --paper: #FFF8E7; --yellow: #FFD60A; --red: #FF2E63; --cyan: #00B8F0; --pink: #FF5FA2; --lime: #7BE04B; --violet: #7C4DFF; --orange: #FF8A00;
  --ok: #16A34A; --amber: #F5C400; --warn: #F97316; --over: #E11D48;
  --head: 52px; --tabs: 62px; --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  --comic: 'Bangers', 'Impact', 'Arial Black', sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; color: var(--ink); font-size: 16px;
  background-color: var(--paper);
  background-image: radial-gradient(rgba(0,0,0,.075) 1.2px, transparent 1.4px); background-size: 9px 9px;
  min-height: 100vh; -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.hide { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- header strip ---------- */
header.strip {
  position: fixed; top: 0; left: 0; right: 0; z-index: 40; height: calc(var(--head) + var(--safe-t)); padding-top: var(--safe-t);
  background: #000; display: flex; align-items: center; justify-content: center; border-bottom: 3px solid var(--yellow);
}
.logo { font-family: var(--comic); font-size: 30px; letter-spacing: 1.5px; line-height: 1; white-space: nowrap; transform: rotate(-2deg); user-select: none; -webkit-user-select: none; }
.logo span { display: inline-block; -webkit-text-stroke: 1.2px #000; paint-order: stroke fill; text-shadow: 2px 2px 0 #fff, 3px 3px 0 rgba(255,255,255,.35); }
.logo .g1 { color: var(--yellow); } .logo .g2 { color: var(--red); font-size: 34px; } .logo .g3 { color: var(--cyan); } .logo .w2 { color: var(--lime); margin-left: 8px; } .logo .w3 { color: var(--pink); margin-left: 8px; }
.logo .r { position: relative; display: inline-block; }
.ver { position: absolute; right: 8px; bottom: 3px; font: 600 10px/1 ui-monospace, Menlo, monospace; color: #9a9a9a; letter-spacing: .3px; }
@media (max-width: 380px) { .logo { font-size: 25px; } .logo .g2 { font-size: 28px; } }

main { padding: calc(var(--head) + var(--safe-t) + 10px) 12px calc(var(--tabs) + var(--safe-b) + 90px); max-width: 760px; margin: 0 auto; }

/* ---------- bottom tabs ---------- */
nav.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; height: calc(var(--tabs) + var(--safe-b)); padding-bottom: var(--safe-b);
  background: #000; display: flex; justify-content: center; border-top: 3px solid var(--yellow);
}
nav.tabs button { flex: 1; max-width: 190px; background: none; border: 0; color: #bbb; font: 400 19px/1 var(--comic); letter-spacing: 1px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
nav.tabs button svg { width: 24px; height: 24px; }
nav.tabs button.on { color: var(--yellow); }
nav.tabs button.on svg { filter: drop-shadow(0 0 0 #000); }

/* ---------- comic panels and buttons ---------- */
.panel { background: #fff; border: 3px solid var(--ink); border-radius: 14px; box-shadow: 4px 4px 0 var(--ink); padding: 12px; margin: 0 0 14px; }
.panel h2, .panel h3 { font: 400 24px/1 var(--comic); letter-spacing: 1px; margin: 0 0 10px; }
.panel h3 { font-size: 21px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 8px 16px; border: 3px solid var(--ink); border-radius: 12px; background: #fff; box-shadow: 3px 3px 0 var(--ink); font-weight: 700; touch-action: manipulation; }
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.btn.pri { background: var(--yellow); }
.btn.go { background: var(--lime); }
.btn.blue { background: var(--cyan); color: #000; }
.btn.danger { background: var(--red); color: #fff; }
.btn.small { min-height: 36px; padding: 4px 12px; font-size: 14px; border-width: 2px; box-shadow: 2px 2px 0 var(--ink); }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .5; }
.btn svg { width: 20px; height: 20px; flex: none; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
.btns .btn { flex: 1 1 auto; }
.link { background: none; border: 0; padding: 4px 0; text-decoration: underline; font-weight: 600; color: #1d4ed8; }
.muted { color: #555; }
.tiny { font-size: 13px; }

/* ---------- fields ---------- */
.f { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.f label { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .6px; color: #333; }
.f input, .f select, .inp { width: 100%; min-height: 44px; padding: 8px 10px; border: 2.5px solid var(--ink); border-radius: 10px; background: #fff; font-size: 16px; }
.f input:focus, .f select:focus, .inp:focus { outline: 3px solid var(--cyan); outline-offset: 1px; }
.f .err { color: var(--over); font-size: 13px; font-weight: 700; }
.f input.bad { border-color: var(--over); background: #FFF0F3; }
.row { display: flex; gap: 8px; }
.row > .f { flex: 1; }
.money-in { position: relative; }
.money-in::before { content: '$'; position: absolute; left: 10px; top: 50%; transform: translateY(-50%); font-weight: 700; color: #555; pointer-events: none; }
.money-in input { padding-left: 22px; }

/* ---------- top bar on the List tab: limit, totals, cart ---------- */
.topbar { position: sticky; top: calc(var(--head) + var(--safe-t)); z-index: 30; display: flex; gap: 10px; align-items: stretch; margin: -6px -12px 12px; padding: 6px 12px 8px; background: var(--paper, #FFF8E7); }
.budget { flex: 1; min-width: 0; background: #fff; border: 3px solid var(--ink); border-radius: 14px; box-shadow: 4px 4px 0 var(--ink); padding: 8px 10px; display: flex; flex-direction: column; justify-content: center; gap: 4px; }
.budget .lim { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; background: none; border: 0; padding: 0; text-align: left; }
.budget .lim b { font: 400 20px/1 var(--comic); letter-spacing: .5px; }
.budget .lim .pen { width: 16px; height: 16px; opacity: .6; }
.bar { height: 10px; border: 2px solid var(--ink); border-radius: 6px; background: #eee; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; transition: width .25s, background .25s; }
.lv-green { --lv: var(--ok); } .lv-amber { --lv: var(--amber); } .lv-orange { --lv: var(--warn); } .lv-red { --lv: var(--over); } .lv-none { --lv: var(--violet); }
.bar i { background: var(--lv); }
.budget .est { font-size: 13px; color: #444; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cart {
  width: 132px; flex: none; position: relative; border: 3px solid var(--ink); border-radius: 16px; box-shadow: 4px 4px 0 var(--ink);

.dollar {
  font: 400 26px/1 var(--comic); letter-spacing: .5px; color: var(--lv); -webkit-text-stroke: 1.4px #000; paint-order: stroke fill; text-shadow: 2px 2px 0 #000;
  white-space: nowrap;
}
.cart .dollar {

  color: var(--lv-pop, #fff); -webkit-text-stroke: 0; text-shadow: none; max-width: 100%; overflow: hidden; text-overflow: ellipsis;

.trash {
  position: fixed; z-index: 35; right: max(14px, calc((100vw - 760px) / 2 + 14px)); bottom: calc(var(--tabs) + var(--safe-b) + 14px);
  width: 64px; height: 64px; border-radius: 50%; border: 3px solid var(--ink); background: #fff; box-shadow: 3px 3px 0 var(--ink);
  display: flex; align-items: center; justify-content: center; transition: transform .12s;

/* ---------- add form ---------- */

.hint { font-size: 13px; color: #444; min-height: 18px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 10px; border: 2px solid var(--ink); border-radius: 999px; background: #E6F8FF; font: 600 13px/1.2 ui-monospace, Menlo, monospace; }

/* ---------- the list ---------- */
.cat { margin: 0 0 12px; border-radius: 14px; }

.item {
  display: flex; align-items: center; gap: 8px; background: #fff; border: 2.5px solid var(--ink); border-radius: 12px; padding: 6px 6px 6px 4px; margin: 0 0 7px;

.drop-line { height: 0; border-top: 4px solid var(--red); border-radius: 2px; margin: -2px 6px 5px; }

body.dragging-on { cursor: grabbing; user-select: none; -webkit-user-select: none; }
.empty-list { text-align: center; padding: 26px 12px; }
.empty-list .big { font: 400 30px/1.1 var(--comic); letter-spacing: 1px; }

/* ---------- sheets ---------- */

.sheet {
  width: 100%; max-width: 640px; max-height: calc(100vh - var(--safe-t) - 24px); max-height: calc(100dvh - var(--safe-t) - 24px); overflow: auto; -webkit-overflow-scrolling: touch;
  background: var(--paper); border: 3px solid var(--ink); border-bottom: 0; border-radius: 20px 20px 0 0; padding: 14px 14px calc(18px + var(--safe-b));

@keyframes up { from { transform: translateY(40px); opacity: 0; } }

/* ---------- history and reports ---------- */
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }

.prow { display: flex; gap: 8px; align-items: baseline; padding: 6px 0; border-bottom: 1px solid #e5e0d0; }
.prow:last-child { border-bottom: 0; }
.prow .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.prow .nm small { display: block; color: #555; font-size: 12px; }

.prow.tap { cursor: pointer; }
.hbar { display: flex; align-items: center; gap: 8px; padding: 5px 0; }
.hbar .lab { width: 118px; flex: none; font-size: 14px; font-weight: 700; }
.hbar .track { flex: 1; height: 18px; border: 2px solid var(--ink); border-radius: 6px; background: #fff; overflow: hidden; }
.hbar .track i { display: block; height: 100%; background: var(--cc, var(--cyan)); }
.hbar .val { width: 86px; flex: none; text-align: right; font-weight: 700; font-size: 14px; }
.over-tag { display: inline-block; padding: 1px 6px; border-radius: 6px; background: var(--over); color: #fff; font-size: 11px; font-weight: 800; vertical-align: 2px; }

/* ---------- sign in ---------- */
.signin { max-width: 440px; margin: 10px auto 0; }
.signin .hero { text-align: center; font: 400 38px/1 var(--comic); letter-spacing: 1px; margin: 18px 0 14px; transform: rotate(-2deg); }
.signin .hero span { display: inline-block; background: var(--yellow); border: 3px solid var(--ink); padding: 8px 14px 4px; border-radius: 12px; box-shadow: 4px 4px 0 var(--ink); }

/* ---------- toast ---------- */
.toast { position: fixed; z-index: 90; left: 50%; bottom: calc(var(--tabs) + var(--safe-b) + 92px); transform: translateX(-50%); max-width: calc(100vw - 24px); background: var(--ink); color: #fff; border-radius: 12px; padding: 10px 14px; display: flex; gap: 14px; align-items: center; font-weight: 600; box-shadow: 3px 3px 0 var(--yellow); }

.sync-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #aaa; margin-right: 6px; vertical-align: 0; }
.sync-dot.ok { background: var(--ok); } .sync-dot.syncing { background: var(--amber); } .sync-dot.offline, .sync-dot.error, .sync-dot.signedout { background: var(--over); }

@media (min-width: 900px) {
  .cart { width: 160px; }
  .add .grid { grid-template-columns: 1fr; }
}
#nHint:empty,#nBc:empty{display:none}

/* ---------- v2 fun: logo hand, flying items, smoke ---------- */
header.strip { overflow: hidden; }
.logo .r { cursor: pointer; transform-origin: 50% 100%; }
.logo .r.squish { animation: fx-squish .55s cubic-bezier(.3,1.6,.5,1); }
@keyframes fx-squish { 0% { transform: none; } 22% { transform: scale(.78, 1.1) skewX(-4deg); } 48% { transform: scale(1.14, .88); } 70% { transform: scale(.95, 1.04); } 100% { transform: none; } }
.fx-hand { position: absolute; left: 42%; top: calc(100% - .62em); width: 1.05em; height: 1.1em; min-width: 22px; min-height: 23px; margin-left: -.5em; padding: 0; border: 0; background: none; transform: translateY(70px); transition: transform .45s cubic-bezier(.3,1.5,.5,1); -webkit-tap-highlight-color: transparent; text-shadow: none; -webkit-text-stroke: 0; }
.fx-hand svg { width: 100%; height: 100%; display: block; overflow: visible; }
.fx-hand .fg { transform-box: fill-box; transform-origin: 50% 100%; transition: transform .25s; }
.fx-hand[data-state="grab"] { transform: translateY(0); }
.fx-hand[data-state="grab"] .fg { transform: scaleY(.62) rotate(4deg); }

.fx-hand[data-state="peek"] { transform: translateY(var(--peek, 17px)); }
.fx-hand[data-state="peek"] .f1 { transform: rotate(-14deg); } .fx-hand[data-state="peek"] .f2 { transform: rotate(-5deg); } .fx-hand[data-state="peek"] .f3 { transform: rotate(5deg); } .fx-hand[data-state="peek"] .f4 { transform: rotate(14deg); }
.fx-hand.drum .fg { animation: fx-drum .9s ease-in-out infinite; }
.fx-hand.drum .f2 { animation-delay: .1s; } .fx-hand.drum .f3 { animation-delay: .2s; } .fx-hand.drum .f4 { animation-delay: .3s; }
.fx-hand.drum-fast .fg { animation-duration: .45s; } .fx-hand.drum-fast .f2 { animation-delay: .05s; } .fx-hand.drum-fast .f3 { animation-delay: .1s; } .fx-hand.drum-fast .f4 { animation-delay: .15s; }
@keyframes fx-drum { 0%, 60%, 100% { translate: 0 0; } 25% { translate: 0 -4px; } }
.fx-fly { position: fixed; left: 0; top: 0; z-index: 95; pointer-events: none; max-width: 160px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 5px 10px 3px; border: 2.5px solid var(--ink); border-radius: 10px; background: var(--yellow); box-shadow: 3px 3px 0 var(--ink); font: 400 18px/1.1 var(--comic); letter-spacing: .5px; will-change: transform; }

@keyframes fx-puff { 0% { transform: translate(0,0) scale(.3); opacity: 1; } 60% { opacity: .9; } 100% { transform: translate(var(--dx), var(--dy)) scale(1.25); opacity: 0; } }
.trash.fx-gulp { animation: bump .35s; }
.snd { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
@media (prefers-reduced-motion: reduce) {
  .fx-hand, .fx-hand .fg { transition: none; }
  .fx-hand.drum .fg, .logo .r.squish, .cart.bump, .trash.fx-gulp { animation: none; }
}
/* ---------- settings cog and category order ---------- */
.cog { flex: none; width: 38px; height: 38px; margin-right: 8px; padding: 5px; border: 2px solid var(--yellow); border-radius: 50%; background: #000; color: var(--yellow); display: inline-flex; align-items: center; justify-content: center; -webkit-tap-highlight-color: transparent; transition: transform .35s ease; }

    ['move', 'List, cart and trash', '<ul><li><b>Into the cart:</b> tap the cart button on the right of an item.</li><li><b>Drag it:</b> on the iPhone, press and hold an item, then slide it onto the cart, the bin or another category. On the Mac, click and drag.</li><li><b>Change category:</b> drag an item into another category and it stays there next time.</li><li><b>Changed your mind?</b> Tap <b>Undo</b> on the message at the bottom, or open the cart and tap an item for <b>Back to list</b> or <b>Trash</b>.</li></ul>'],
    ['totals', 'Cart total and the List amount', '<ul><li><b>The cart total</b> (in the black box on the cart) is what is in your trolley now.</li><li><b>List</b>, under the limit bar, is roughly what is still on your list. Items with no price yet show as "+ unpriced".</li><li><b>Spending limit:</b> tap <b>Set a spending limit</b> to choose an amount for this shop. The bar shows how much is left.</li></ul><div class="lvkey"><span><span class="k green">Green</span>under 75% of the limit</span><span><span class="k amber">Yellow</span>from 75%</span><span><span class="k orange">Orange</span>from 90%</span><span><span class="k red">Red</span>over the limit</span></div>'],

    ['done', 'Shopping complete', '<ul><li>Open the cart and tap <b>Shopping complete</b>.</li><li>Choose the <b>store</b>, then the <b>branch</b>. A new store or branch is typed once (use <b>Other…</b> or <b>New branch…</b>) and remembered after that.</li><li>Check the date and tap <b>Complete</b>. The cart goes into your history with its prices, and anything still on your list stays there for next time.</li></ul>'],

    ['order', 'Changing category order', '<ul><li>Tap the <b>cog</b>, then <b>Category order</b> (or <b>Change category order</b> in More).</li><li>Use ▲ and ▼ to move a category. Your list and menus follow straight away.</li><li><b>Reset to the standard order</b> puts it back. Items always stay in their own category.</li></ul>'],

    var t = e.target;
    if (t.hasAttribute('data-hf') && t.id !== 'hq') { ui.hf[t.getAttribute('data-hf')] = t.value; render(); }
    if (t.hasAttribute('data-rf')) { ui.rf[t.getAttribute('data-rf')] = t.value; render(); }
    if (t.form && t.form.id === 'doneForm' && (t.name === 'store' || t.name === 'branch')) {
      var s = ui.sheet; readDone(t.form, s);
      if (t.name === 'store') { var br = s.store && s.store !== '__other' ? G.branches(R(), s.store) : []; s.branch = br.length ? (s.store === lastStore().store && br.indexOf(lastStore().branch) >= 0 ? lastStore().branch : br[0]) : ''; s.focus = s.store === '__other' ? '#dOther' : (!br.length && s.store ? '#dNewBranch' : null); }
      if (t.name === 'branch' && s.branch === '__new') s.focus = '#dNewBranch';
      renderSheet();
    }
  });
  function readDone(f, s) {
    s.store = f.elements.store.value; s.branch = f.elements.branch ? f.elements.branch.value : s.branch;
    s.other = f.elements.other ? f.elements.other.value : s.other; s.newbranch = f.elements.newbranch ? f.elements.newbranch.value : s.newbranch; s.date = f.elements.date.value;
  }
  document.addEventListener('submit', function (e) {
    var f = e.target; e.preventDefault();
    try { submit(f); } catch (err) { var box = f.querySelector('[role=alert]'); if (box) box.textContent = err.message; else toast(err.message); }
  });
  function submit(f) {
    var r = R();
    if (f.id === 'addForm') {
      var name = f.elements.name.value.trim(); if (!name) { f.elements.name.focus(); toast('Type what you need first.'); return; }
      var ch = G.addItem(r, { name: name, qty: f.elements.qty.value, price: f.elements.price.value, cat: f.elements.cat.value || undefined, barcode: ui.addBarcode });
      var it = ch[Object.keys(ch).filter(function (k) { return k.slice(0, 2) === 'i:'; })[0]];
      ui.addBarcode = ''; f.reset();
      // Done adding: let go of the form so the keyboard and the Item suggestion list close (iOS reopens them on refocus).
      var ae = document.activeElement; if (ae && ae.form === f && ae.blur) ae.blur();
      act(ch, it.name + ' added to ' + it.cat, true);
      var nf = $('addForm'); if (nf) { nf.elements.name.value = ''; nf.elements.qty.value = ''; nf.elements.price.value = ''; nf.elements.cat.value = ''; addHint(); var fa = document.activeElement; if (fa && fa.form === nf && fa.blur) fa.blur(); }
      var row = document.querySelector('.item[data-id="' + it.id + '"]'); if (row) row.classList.add('flash');
      return;
    }
    if (f.id === 'editForm') {
      var id = f.getAttribute('data-id');
      act(G.editItem(r, id, { name: f.elements.name.value, qty: f.elements.qty.value, price: f.elements.price.value, cat: f.elements.cat.value, barcode: f.elements.barcode.value }), 'Saved');
      closeSheet(); return;
    }
    if (f.getAttribute('data-form') === 'cedit') {
      var cid = f.getAttribute('data-id');
      ui.sheet.fresh = true; act(G.editItem(r, cid, { qty: f.elements.qty.value, price: f.elements.price.value }), 'Saved'); return;
    }
    if (f.id === 'limitForm') { var v = f.elements.limit.value.trim(); if (!v) throw new Error('Type an amount, like 150.'); act(G.setLimit(r, v), 'Limit set to ' + G.money(G.parseMoney(v))); closeSheet(); return; }
    if (f.id === 'doneForm') {
      var s = ui.sheet; readDone(f, s);
      if (!s.store) throw new Error('Pick the store first.');
      var store = s.store === '__other' ? (s.other || '').trim() : s.store;
      if (!store) throw new Error('Type the store name.');
      var useNew = s.store === '__other' || s.branch === '__new' || !G.branches(r, store).length;
      var branch = useNew ? (s.newbranch || '').trim() : s.branch;
      var total = G.totals(r).cart, count = G.items(r, 'cart').length;
      act(G.completeTrip(r, { store: store, branch: branch, date: s.date }), 'Trip saved: ' + count + ' item' + (count === 1 ? '' : 's') + ', ' + G.money(total));
      closeSheet(); return;
    }
    if (f.id === 'scanForm') { var code = f.elements.code.value.replace(/\s+/g, ''); if (!code) throw new Error('Type the barcode number.'); gotCode(code); return; }
    if (f.id === 'pwForm') {
      var btn = f.querySelector('button[type=submit]'); btn.disabled = true;
      eng.setPassword(f.elements.pw.value).then(function () { closeSheet(); toast('Password saved'); }, function (err) { btn.disabled = false; $('pErr').textContent = err.message; });
      return;
    }
    if (f.id === 'authForm') {
      var email = f.elements.email.value.trim(), pw = f.elements.password ? f.elements.password.value : '', go = $('aGo'), errEl = $('aErr');
      if (!/^\S+@\S+\.\S+$/.test(email)) { errEl.textContent = 'Type your email address.'; return; }
      if (ui.auth !== 'forgot' && !pw) { errEl.textContent = 'Type your password.'; return; }
      var label = go.textContent; go.disabled = true; go.textContent = 'One moment…'; errEl.textContent = '';
      var here = location.origin + location.pathname;
      var p = ui.auth === 'up' ? eng.signUp(email, pw, here) : ui.auth === 'forgot' ? eng.recover(email, here) : eng.signIn(email, pw);
      p.then(function (res) {
        if (ui.auth === 'forgot') { eng.auth.email = email; ui.auth = 'in'; render(); toast('Check your email for the reset link.'); return; }
        if (res && res.confirm) { eng.auth.email = email; ui.auth = 'in'; render(); var e2 = $('aErr'); if (e2) { e2.style.color = '#166534'; e2.textContent = 'Nearly there: check your email and tap the confirm link, then sign in here.'; } return; }
        ui.auth = 'in'; render();
      }, function (err) { go.disabled = false; go.textContent = label; errEl.textContent = err.message; });
    }
  }

  // ---------- drag and drop: click-drag with a mouse, press-hold-slide on a phone ----------
  var dragging = null, suppressClick = false, press = null;
  function rowFrom(t) { var row = t.closest && t.closest('.item'); return row && !t.closest('button.grab') ? row : null; }
  document.addEventListener('mousedown', function (e) {
    if (e.button !== 0) return; var row = rowFrom(e.target); if (!row) return;
    press = { id: row.getAttribute('data-id'), row: row, x: e.clientX, y: e.clientY, mouse: true };
  });
  document.addEventListener('mousemove', function (e) {
    if (dragging) { e.preventDefault(); dragMove(e.clientX, e.clientY); return; }
    if (press && press.mouse && Math.hypot(e.clientX - press.x, e.clientY - press.y) > 6) { dragStart(press, e.clientX, e.clientY); }
  });
  document.addEventListener('mouseup', function (e) { if (dragging) { dragEnd(e.clientX, e.clientY); suppressClick = true; setTimeout(function () { suppressClick = false; }, 50); } press = null; });
  document.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) { cancelPress(); return; }
    var row = rowFrom(e.target); if (!row) return; var t = e.touches[0];
    press = { id: row.getAttribute('data-id'), row: row, x: t.clientX, y: t.clientY, touch: true };
    press.timer = setTimeout(function () { if (press) { if (navigator.vibrate) navigator.vibrate(15); dragStart(press, press.x, press.y); } }, 380);
  }, { passive: true });
  document.addEventListener('touchmove', function (e) {
    var t = e.touches[0];
    if (dragging) { e.preventDefault(); dragMove(t.clientX, t.clientY); return; }
    if (press && press.touch) { press.lx = t.clientX; press.ly = t.clientY; if (Math.hypot(t.clientX - press.x, t.clientY - press.y) > 10) cancelPress(); }
  }, { passive: false });
  document.addEventListener('touchend', function (e) {
    if (dragging) { e.preventDefault(); var t = e.changedTouches[0]; dragEnd(t.clientX, t.clientY); suppressClick = true; setTimeout(function () { suppressClick = false; }, 400); }
    cancelPress();
  }, { passive: false });
  document.addEventListener('touchcancel', function () { if (dragging) dragCancel(); cancelPress(); });
  document.addEventListener('contextmenu', function (e) { if (dragging || (press && press.touch)) e.preventDefault(); });
  function cancelPress() { if (press && press.timer) clearTimeout(press.timer); press = null; }

  function dragStart(p, x, y) {
    var it = R()['i:' + p.id]; if (!it) return;
    var before = p.row.getBoundingClientRect();
    dragging = { id: p.id, target: null, dx: x - before.left, dy: y - before.top, w: before.width };
    document.body.classList.add('dragging-on');
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    // Show every category (empty ones become drop zones) and keep the picked-up row where it was on screen.
    app.innerHTML = listHTML();
    var row = app.querySelector('.item[data-id="' + CSS.escape(p.id) + '"]');
    // Put the original row back in place: a phone keeps sending the finger's moves to the element it first touched,
    // and they would stop reaching the page if that element were swapped out.
    if (row && p.row && row !== p.row) { row.replaceWith(p.row); row = p.row; }
    if (row) { var after = row.getBoundingClientRect(); window.scrollBy(0, after.top - before.top); row.classList.add('ghosted'); }
    var g = (row || p.row).cloneNode(true); g.classList.remove('ghosted'); g.classList.add('ghost'); g.style.width = before.width + 'px';
    document.body.appendChild(g); dragging.ghost = g; dragging.row = row;
    dragMove(x, y);
    autoScroll();
  }
  function clearMarks() {
    var l = document.querySelector('.drop-line'); if (l) l.remove();
    document.querySelectorAll('.cat.over, .hot').forEach(function (n) { n.classList.remove('over'); n.classList.remove('hot'); });
  }
  function dragMove(x, y) {
    var d = dragging; if (!d) return;
    d.x = x; d.y = y;
    d.ghost.style.left = (x - d.dx) + 'px'; d.ghost.style.top = (y - d.dy) + 'px';
    var el = document.elementFromPoint(x, y), tgt = null;
    clearMarks();
    if (el) {
      var drop = el.closest('[data-drop]');
      if (drop) { tgt = { kind: drop.getAttribute('data-drop') }; drop.classList.add('hot'); }
      else {
        var sec = el.closest('.cat');
        if (sec) {
          var cat = sec.getAttribute('data-cat'), rows = [].slice.call(sec.querySelectorAll('.item')).filter(function (r) { return r.getAttribute('data-id') !== d.id; });
          var before = null;
          for (var i = 0; i < rows.length; i++) { var b = rows[i].getBoundingClientRect(); if (y < b.top + b.height / 2) { before = rows[i]; break; } }
          tgt = { kind: 'list', cat: cat, before: before ? before.getAttribute('data-id') : null };
          sec.classList.add('over');
          var line = document.createElement('div'); line.className = 'drop-line';
          var zone = sec.querySelector('.zone');
          if (rows.length) { if (before) zone.insertBefore(line, before); else zone.appendChild(line); }
        }
      }
    }
    d.target = tgt;
  }
  function autoScroll() {
    if (!dragging) return;
    var d = dragging, top = 150, bot = window.innerHeight - 110, sp = 0;
    if (d.y != null) { if (d.y < top) sp = -Math.min(18, (top - d.y) / 4 + 2); else if (d.y > bot) sp = Math.min(18, (d.y - bot) / 4 + 2); }
    if (sp) { window.scrollBy(0, sp); dragMove(d.x, d.y); }
    requestAnimationFrame(autoScroll);
  }
  function dragEnd() {
    var d = dragging; if (!d) return;
    var r = R(), it = r['i:' + d.id], t = d.target, gb = d.ghost && d.ghost.getBoundingClientRect();
    finishDrag();
    if (!it || !t) { render(); return; }
    if (t.kind === 'cart') { act(G.moveItem(r, d.id, 'cart'), it.name + ' in the cart' + (it.price != null ? ' +' + G.money(G.lineCents(it) / 100) : ''), true); fxCart(it.name, gb); }
    else if (t.kind === 'trash') { act(G.moveItem(r, d.id, 'trash'), it.name + ' in the trash', true); fxTrash(it.name, gb); }
    else if (t.kind === 'list') { var ch = G.placeInList(r, d.id, t.cat, t.before); if (Object.keys(ch).length) act(ch, G.catOf(it) !== t.cat ? it.name + ' moved to ' + t.cat : '', G.catOf(it) !== t.cat); else render(); }
    else render();
  }
  function finishDrag() { if (dragging && dragging.ghost) dragging.ghost.remove(); clearMarks(); dragging = null; document.body.classList.remove('dragging-on'); }
  function dragCancel() { finishDrag(); render(); }

  // ---------- start ----------
  function boot() {
    if (configured && /access_token=|error=/.test(location.hash)) {
      var h = location.hash; history.replaceState(null, '', location.pathname + location.search);
      eng.fromHash(h).then(function (res) {
        if (res && res.error) { render(); var e = $('aErr'); if (e) e.textContent = res.error; else toast(res.error); return; }
        render();
        if (res && res.type === 'recovery') openSheet({ type: 'password', recovery: true, focus: '#pNew' });
        else if (res) toast('You\'re in! Welcome to GaF Grocery Grabber.');
      });
    }
    render();
    if (eng.signedIn()) eng.sync();
    document.addEventListener('visibilitychange', function () { if (eng.signedIn() && (!document.hidden || eng.pendingCount())) eng.sync(); });
    window.addEventListener('pagehide', function () { if (eng.signedIn() && eng.pendingCount()) eng.sync(); });
    window.addEventListener('online', function () { if (eng.signedIn()) eng.sync(); });
    setInterval(function () { if (!document.hidden && eng.signedIn() && !dragging) eng.sync(); }, 45000);
  }
  window.GAF = { eng: eng, ui: ui, render: render };
  boot();
})();
</script>
